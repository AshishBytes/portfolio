<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1F2E"/>
      <stop offset="55%" stop-color="#31398A"/>
      <stop offset="100%" stop-color="#5865F2"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base & Subtle Engineering Grid -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="1040" cy="120" r="220" fill="#5865F2" opacity="0.25"/>
  <circle cx="180" cy="540" r="180" fill="#57F287" opacity="0.08"/>

  <!-- Left Icon Card: Bot Gateway & Slash Command Emblem -->
  <g transform="translate(120, 195)">
    <rect width="220" height="220" rx="44" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- Antenna -->
    <line x1="110" y1="38" x2="110" y2="62" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <circle cx="110" cy="34" r="8" fill="#57F287"/>
    <!-- Bot Visor -->
    <rect x="46" y="64" width="128" height="92" rx="26" fill="rgba(15,17,26,0.55)" stroke="white" stroke-width="7"/>
    <!-- Eyes -->
    <circle cx="84" cy="108" r="11" fill="#57F287"/>
    <circle cx="136" cy="108" r="11" fill="#57F287"/>
    <!-- Slash Command Pill -->
    <rect x="66" y="172" width="88" height="14" rx="7" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- Right Main Content -->
  <g transform="translate(390, 215)">
    <!-- Category Eyebrow -->
    <text x="0" y="-32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#99AAB5" letter-spacing="2">
      DISCORD PLATFORM · EVENT-DRIVEN BOT
    </text>

    <!-- Title -->
    <text x="0" y="32" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-1.5">
      Reef Bot
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="500" fill="rgba(255,255,255,0.85)">
      Moderation, Spam Prevention, Voice &amp; Slash Commands
    </text>

    <!-- Metric Badges (Properly sized to prevent text clipping) -->
    <g transform="translate(0, 122)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="180" height="48" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="90" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">
        585K+ Users
      </text>

      <!-- Badge 2 -->
      <rect x="196" y="0" width="190" height="48" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="291" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">
        850+ Servers
      </text>

      <!-- Badge 3 -->
      <rect x="402" y="0" width="205" height="48" rx="24" fill="rgba(87, 242, 135, 0.18)" stroke="rgba(87, 242, 135, 0.45)" stroke-width="1"/>
      <text x="504" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#57F287" text-anchor="middle">
        ✓ Verified Bot
      </text>
    </g>

    <!-- Tech Stack Footer -->
    <text x="0" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" fill="rgba(255,255,255,0.72)">
      Node.js  •  Discord.js  •  MongoDB  •  Express.js  •  WebSockets
    </text>
  </g>
</svg>
