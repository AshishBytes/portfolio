<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="55%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base & Subtle Engineering Grid -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="1040" cy="120" r="220" fill="#38BDF8" opacity="0.22"/>
  <circle cx="180" cy="540" r="180" fill="#EF4444" opacity="0.1"/>

  <!-- Left Icon Card: Capture Lens + Chunked Stream Bars -->
  <g transform="translate(120, 195)">
    <rect width="220" height="220" rx="44" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- Outer Capture Ring -->
    <circle cx="110" cy="96" r="46" stroke="white" stroke-width="6" fill="rgba(11,25,44,0.45)"/>
    <!-- Active Recording Dot -->
    <circle cx="110" cy="96" r="22" fill="#EF4444"/>
    <!-- Chunked Journal Segments -->
    <rect x="44" y="164" width="38" height="12" rx="6" fill="#38BDF8"/>
    <rect x="91" y="164" width="38" height="12" rx="6" fill="#38BDF8"/>
    <rect x="138" y="164" width="38" height="12" rx="6" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- Right Main Content -->
  <g transform="translate(390, 215)">
    <!-- Category Eyebrow -->
    <text x="0" y="-32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#BAE6FD" letter-spacing="2">
      MEDIA CAPTURE · PLAYWRIGHT &amp; FASTAPI
    </text>

    <!-- Title -->
    <text x="0" y="32" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="68" font-weight="800" fill="white" letter-spacing="-1.5">
      StreamSync Recorder
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="500" fill="rgba(255,255,255,0.85)">
      Crash-Safe WebM Capture &amp; SHA-256 Chunk Journaling
    </text>

    <!-- Metric Badges -->
    <g transform="translate(0, 122)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="185" height="48" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="92.5" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">
        5s WebM Chunks
      </text>

      <!-- Badge 2 -->
      <rect x="201" y="0" width="205" height="48" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="303.5" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">
        SHA-256 Journal
      </text>

      <!-- Badge 3 -->
      <rect x="422" y="0" width="190" height="48" rx="24" fill="rgba(56, 189, 248, 0.22)" stroke="rgba(125, 211, 252, 0.45)" stroke-width="1"/>
      <text x="517" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#E0F2FE" text-anchor="middle">
        fsync Recovery
      </text>
    </g>

    <!-- Tech Stack Footer -->
    <text x="0" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" fill="rgba(255,255,255,0.75)">
      Python  •  FastAPI  •  Playwright  •  Chromium  •  SQLite  •  MediaRecorder
    </text>
  </g>
</svg>
