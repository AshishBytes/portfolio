<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A0D1E"/>
      <stop offset="55%" stop-color="#9D174D"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base & Subtle Engineering Grid -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="1040" cy="120" r="220" fill="#F472B6" opacity="0.22"/>
  <circle cx="180" cy="540" r="180" fill="#57F287" opacity="0.08"/>

  <!-- Left Icon Card: Voice Equalizer -->
  <g transform="translate(120, 195)">
    <rect width="220" height="220" rx="44" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- Audio Equalizer Bars -->
    <rect x="52" y="92" width="16" height="56" rx="8" fill="rgba(255,255,255,0.75)"/>
    <rect x="78" y="62" width="16" height="106" rx="8" fill="white"/>
    <rect x="104" y="44" width="16" height="134" rx="8" fill="#FBCFE8"/>
    <rect x="130" y="72" width="16" height="96" rx="8" fill="white"/>
    <rect x="156" y="98" width="16" height="46" rx="8" fill="rgba(255,255,255,0.75)"/>
  </g>

  <!-- Right Main Content -->
  <g transform="translate(390, 215)">
    <!-- Category Eyebrow -->
    <text x="0" y="-32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#FBCFE8" letter-spacing="2">
      DISCORD PLATFORM · VOICE &amp; RADIO BOT
    </text>

    <!-- Title -->
    <text x="0" y="32" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-1.5">
      HAPPY Bot
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="500" fill="rgba(255,255,255,0.85)">
      Discord-Verified Music Streaming &amp; 24/7 Radio Engine
    </text>

    <!-- Metric Badges -->
    <g transform="translate(0, 122)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="195" height="48" rx="24" fill="rgba(87, 242, 135, 0.18)" stroke="rgba(87, 242, 135, 0.45)" stroke-width="1"/>
      <text x="97.5" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#57F287" text-anchor="middle">
        ✓ Verified Bot
      </text>

      <!-- Badge 2 -->
      <rect x="211" y="0" width="175" height="48" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="298.5" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">
        963 Commits
      </text>

      <!-- Badge 3 -->
      <rect x="402" y="0" width="190" height="48" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="497" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">
        Music &amp; Radio
      </text>
    </g>

    <!-- Tech Stack Footer -->
    <text x="0" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" fill="rgba(255,255,255,0.75)">
      JavaScript  •  Node.js  •  Discord.js  •  Discord API  •  MongoDB
    </text>
  </g>
</svg>
