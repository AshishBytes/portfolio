<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06232C"/>
      <stop offset="55%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base & Subtle Engineering Grid -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="1040" cy="120" r="220" fill="#22D3EE" opacity="0.22"/>
  <circle cx="180" cy="540" r="180" fill="#A5F3FC" opacity="0.08"/>

  <!-- Left Icon Card: Map Pin + Connected Route Waypoints -->
  <g transform="translate(120, 195)">
    <rect width="220" height="220" rx="44" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- Dashed Route Path -->
    <path d="M 56 164 Q 95 152 110 128" stroke="#67E8F9" stroke-width="4.5" stroke-dasharray="7 7" stroke-linecap="round" fill="none"/>
    <circle cx="54" cy="166" r="8" fill="#67E8F9"/>
    <!-- Location Pin -->
    <path d="M 110 38 C 82 38 62 58 62 84 C 62 114 110 154 110 154 C 110 154 158 114 158 84 C 158 58 138 38 110 38 Z" fill="rgba(6,35,44,0.55)" stroke="white" stroke-width="5.5"/>
    <circle cx="110" cy="84" r="16" fill="#22D3EE"/>
  </g>

  <!-- Right Main Content -->
  <g transform="translate(390, 215)">
    <!-- Category Eyebrow -->
    <text x="0" y="-32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#A5F3FC" letter-spacing="2">
      FULL-STACK WEB · SMART TRIP PLANNER
    </text>

    <!-- Title -->
    <text x="0" y="32" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-1.5">
      TravelQuest
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="500" fill="rgba(255,255,255,0.85)">
      Personalized Itineraries, Real-Time APIs &amp; AI Travel Assistant
    </text>

    <!-- Metric Badges -->
    <g transform="translate(0, 122)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="185" height="48" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="92.5" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">
        Google Maps
      </text>

      <!-- Badge 2 -->
      <rect x="201" y="0" width="190" height="48" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="296" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">
        OpenWeather
      </text>

      <!-- Badge 3 -->
      <rect x="407" y="0" width="175" height="48" rx="24" fill="rgba(34, 211, 238, 0.22)" stroke="rgba(165, 243, 252, 0.45)" stroke-width="1"/>
      <text x="494.5" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#CFFAFE" text-anchor="middle">
        AI Chatbot
      </text>
    </g>

    <!-- Tech Stack Footer -->
    <text x="0" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" fill="rgba(255,255,255,0.75)">
      Node.js  •  Express  •  JavaScript  •  Google Maps  •  OpenWeather  •  Eventbrite
    </text>
  </g>
</svg>
