<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1033"/>
      <stop offset="55%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base & Subtle Engineering Grid -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="1040" cy="120" r="220" fill="#8B5CF6" opacity="0.25"/>
  <circle cx="180" cy="540" r="180" fill="#C084FC" opacity="0.1"/>

  <!-- Left Icon Card: 9:16 Vertical Video Frame + Timeline Tracks -->
  <g transform="translate(120, 195)">
    <rect width="220" height="220" rx="44" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- Vertical 9:16 Frame -->
    <rect x="74" y="34" width="72" height="114" rx="14" fill="rgba(15,10,30,0.6)" stroke="white" stroke-width="5"/>
    <!-- Play Triangle -->
    <polygon points="103,77 103,105 125,91" fill="#E9D5FF"/>
    <!-- Timeline & Audio Tracks -->
    <rect x="44" y="164" width="84" height="10" rx="5" fill="#C084FC"/>
    <rect x="134" y="164" width="42" height="10" rx="5" fill="rgba(255,255,255,0.4)"/>
    <rect x="58" y="182" width="104" height="8" rx="4" fill="rgba(255,255,255,0.28)"/>
  </g>

  <!-- Right Main Content -->
  <g transform="translate(390, 215)">
    <!-- Category Eyebrow -->
    <text x="0" y="-32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#DDD6FE" letter-spacing="2">
      VIDEO PRODUCTION · CLI &amp; LOCAL STUDIO
    </text>

    <!-- Title -->
    <text x="0" y="32" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-1.5">
      AI Video Studio
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="500" fill="rgba(255,255,255,0.85)">
      Vertical Short-Form Video Pipeline &amp; Browser Workspace
    </text>

    <!-- Metric Badges (Centered text & proper widths) -->
    <g transform="translate(0, 122)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="48" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="82.5" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">
        CLI + Web
      </text>

      <!-- Badge 2 -->
      <rect x="181" y="0" width="175" height="48" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="268.5" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">
        Python 3.11+
      </text>

      <!-- Badge 3 -->
      <rect x="372" y="0" width="235" height="48" rx="24" fill="rgba(192, 132, 252, 0.22)" stroke="rgba(216, 180, 254, 0.45)" stroke-width="1"/>
      <text x="489.5" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#F3E8FF" text-anchor="middle">
        FFmpeg + Remotion
      </text>
    </g>

    <!-- Tech Stack Footer -->
    <text x="0" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" fill="rgba(255,255,255,0.75)">
      Python  •  FastAPI  •  React  •  Node.js  •  FFmpeg  •  Remotion
    </text>
  </g>
</svg>
